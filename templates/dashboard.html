<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JaAbriuChamado? — Início</title>
  <link rel="stylesheet" href="/public/css/dashboard.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/dashboard" aria-label="Página inicial">
      <span class="brand-icon" aria-hidden="true">⌕</span>
      <span><strong>JaAbriuChamado?</strong><small>SISTEMA DE CHAMADOS</small></span>
    </a>

    <nav class="navigation" aria-label="Navegação principal">
      <a class="active" href="/dashboard">Início</a>
      <button type="button" data-coming-soon>Pessoas</button>
      <button type="button" data-coming-soon>Abrir Chamado</button>
    </nav>

    <div class="account">
      <button class="account-button" id="account-button" type="button" aria-expanded="false" aria-controls="account-menu">
        <span><strong>Suporte Admin</strong><small>TI Departamento</small></span>
        <span class="avatar" aria-hidden="true">A</span>
      </button>
      <div class="account-menu" id="account-menu" hidden>
        <strong>admin@email.com</strong>
        <button type="button" id="logout-button">Sair</button>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <section class="intro" aria-labelledby="welcome-title">
      <p class="eyebrow">PAINEL INICIAL</p>
      <h1 id="welcome-title">Bem-vindo ao JaAbriuChamado?</h1>

    </section>

    <section class="quick-actions" aria-label="Ações rápidas">
      <article class="action-card">
        <span class="action-icon blue" aria-hidden="true">+</span>
        <span class="tag"></span>
        <h2>Criar Chamado</h2>
        <p></p>
      </article>

      <article class="action-card">
        <span class="action-icon violet" aria-hidden="true">♙</span>
        <span class="tag">ADMIN</span>
        <h2>Registro de Pessoas</h2>
        <p>Cadastre e organize os usuários e departamentos do sistema.</p>
      </article>

      <article class="action-card">
        <span class="action-icon green" aria-hidden="true">✓</span>
        <span class="tag">PRONTO</span>
        <h2>chamados prontos</h2>
      </article>
    </section>

    <section class="empty-panel" aria-labelledby="activity-title">
      <div class="empty-icon" aria-hidden="true">▤</div>
      <h2 id="activity-title">chamados</h2>
      <p>chmados apareceram aqui.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/public/js/dashboard.js"></script>
</body>
</html>
